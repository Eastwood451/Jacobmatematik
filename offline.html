<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#291448">
  <title>Ingen forbindelse · Jacobmatematik</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #291448; color: #f7ead0; font: 18px/1.5 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 32px 24px; }
    h1 { margin: 0 0 12px; font-size: 1.7rem; line-height: 1.2; }
    p { margin: 0 0 16px; }
    button { font: 700 16px/1.2 system-ui, sans-serif; min-height: 48px; padding: 12px 18px; border: 0; border-radius: 10px; background: #f7ead0; color: #291448; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Der er ingen forbindelse</h1>
    <p>Jacobmatematik skal bruge internet for at hente øvelserne. Der er ikke gemt en offline-kopi af opgaverne.</p>
    <p>No connection. The exercises need internet and are not stored offline.</p>
    <button type="button" id="retry">Prøv igen</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
