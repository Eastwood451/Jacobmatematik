plugins {
    id "com.android.application"
}

def uploadStore = System.getenv("JM_UPLOAD_STORE_FILE")

android {
    namespace "dk.jacobmatematik.app"
    compileSdk 36

    defaultConfig {
        applicationId "dk.jacobmatematik.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (uploadStore) {
                storeFile file(uploadStore)
                storePassword System.getenv("JM_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("JM_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("JM_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (uploadStore) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt"]
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
