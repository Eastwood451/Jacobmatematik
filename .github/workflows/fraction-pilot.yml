name: Fraction pilot checks

on:
  push:
    branches: [main, 'feature/jacob-fraction-lesson-20260918', 'feature/fraction-multiply-20260918', 'feature/fraction-simplify-20260918', 'feature/fraction-add-subtract-20260918', 'feature/fraction-times-20260918']
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'fraction-lesson.*'
      - 'fraction-multiply.css'
      - 'fraction-simplify.*'
      - 'fraction-add-subtract.*'
      - 'scripts/test-fraction-*.cjs'
      - 'scripts/fraction-finish-support.cjs'
      - '.github/workflows/fraction-pilot.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'fraction-lesson.*'
      - 'fraction-multiply.css'
      - 'fraction-simplify.*'
      - 'fraction-add-subtract.*'
      - 'scripts/test-fraction-*.cjs'
      - 'scripts/fraction-finish-support.cjs'
      - '.github/workflows/fraction-pilot.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check fraction-lesson.js
          node --check fraction-simplify.js
          node --check fraction-add-subtract.js
          node --check scripts/test-fraction-pilot.cjs
          node --check scripts/test-fraction-drag.cjs
          node --check scripts/test-fraction-simplify.cjs
          node --check scripts/test-fraction-add-subtract.cjs
          node --check scripts/test-fraction-multiply.cjs
          node --check scripts/fraction-finish-support.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run browser tests without real accounts or database writes
        run: |
          node scripts/test-fraction-pilot.cjs
          node scripts/test-fraction-drag.cjs
          node scripts/test-fraction-simplify.cjs
          node scripts/test-fraction-add-subtract.cjs
          node scripts/test-fraction-multiply.cjs
      - name: Save test screenshots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraction-pilot-review
          path: |
            test-results/fraction-pilot/
            test-results/fraction-drag/
            test-results/fraction-simplify/
            test-results/fraction-add-subtract/
            test-results/fraction-multiply/
          retention-days: 7
