name: Publish skak and clock card
on:
  push:
    paths:
      - '.github/workflows/publish-skak-clock-20261019.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home cards
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='''  // Skak er en beta, der kun vises på Jacobs profil (lærerkontoen "Jacob") og hans testelev "jacobe",\n  // så han kan prøve både computer- og online-kampe, før eleverne får adgang. Udvid listen for at åbne for flere.\n  const SKAK_PROFILE_IDS = new Set(["c8b8e1c4-3264-40e9-a43d-0eb6214a0183", "3af639de-b0e0-496a-a5b7-b732e49d1fa7"]);\n  const canPlaySkak = () => Boolean(state.user?.id && SKAK_PROFILE_IDS.has(state.user.id) && ["teacher","student"].includes(state.user.role));'''
          new='''  // Skak er udgivet til alle brugerroller. Gæster kan spille lokalt mod computeren; online kræver fortsat login.\n  const canPlaySkak = () => gameModuleEnabled(state.user);'''
          assert old in s, 'Skak access block not found'
          s=s.replace(old,new,1)
          old='''  function clockCard() {\n    return canLearnClock() ? `<button type="button" class="topic-card" data-action="clock"><span class="topic-icon">◷</span><strong>Lær klokken</strong><small>Hvad er klokken? Øv minutter i, over, halv og kvart.</small></button>` : "";\n  }'''
          new='''  function clockCard() {\n    return canLearnClock() ? `<button type="button" class="topic-card clock-home-card" data-action="clock"><span class="clock-card-art" aria-hidden="true"><svg viewBox="0 0 160 104" role="img"><path d="M80 12A40 40 0 0 0 80 92" fill="#dce9ff" stroke="#4267a9" stroke-width="2"/><path d="M80 12A40 40 0 0 1 80 92" fill="#ffe2df" stroke="#c9524a" stroke-width="2"/><circle cx="80" cy="52" r="40" fill="none" stroke="#51476a" stroke-width="2.5"/><path d="M80 52L80 20" stroke="#51476a" stroke-width="4" stroke-linecap="round"/><path d="M80 52L101 68" stroke="#51476a" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="52" r="4" fill="#51476a"/><text x="38" y="56" text-anchor="middle" font-size="9" font-weight="800" fill="#365b9b">MINUTTER</text><text x="38" y="67" text-anchor="middle" font-size="12" font-weight="900" fill="#365b9b">I</text><text x="122" y="56" text-anchor="middle" font-size="9" font-weight="800" fill="#b84640">MINUTTER</text><text x="122" y="67" text-anchor="middle" font-size="10" font-weight="900" fill="#b84640">OVER</text></svg></span><span class="clock-card-copy"><strong>Lær klokken</strong><small>Hvad er klokken? Øv minutter i, over, halv og kvart.</small></span></button>` : "";\n  }'''
          assert old in s, 'Clock card block not found'
          s=s.replace(old,new,1)
          old='''    const extraCards = otherTopics.map(card).join("") + (isGuest() ? "" : `<button type="button" class="topic-card mixed" data-topic="mixed"><span class="topic-icon">∞</span><strong>Blandet træning</strong><small>Systemet vælger smart for dig</small></button>`);'''
          new='''    const extraCards = otherTopics.map(card).join("") + skakCard() + (isGuest() ? "" : `<button type="button" class="topic-card mixed" data-topic="mixed"><span class="topic-icon">∞</span><strong>Blandet træning</strong><small>Systemet vælger smart for dig</small></button>`);'''
          assert old in s, 'Extra cards line not found'
          s=s.replace(old,new,1)
          old='''  const canUseSandbox = () => isFractionTester() || canPlaySkak();'''
          new='''  const canUseSandbox = () => isFractionTester();'''
          assert old in s, 'Sandbox access line not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          css=Path('styles.css'); c=css.read_text(); c += '''\n.clock-home-card{display:grid;grid-template-columns:minmax(105px,42%) 1fr;align-items:center;gap:12px;text-align:left}\n.clock-card-art{display:block;width:100%;max-width:150px;justify-self:center}\n.clock-card-art svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 7px rgba(48,38,73,.10))}\n.clock-card-copy{display:grid;gap:5px}.clock-card-copy strong{font:inherit;font-weight:800}.clock-card-copy small{line-height:1.35}\n.skak-card .topic-icon{font-size:1.45rem}\n@media(max-width:520px){.clock-home-card{grid-template-columns:96px 1fr;gap:8px}.clock-card-art{max-width:110px}}\n'''; css.write_text(c)
          idx=Path('index.html'); h=idx.read_text(); h=h.replace('app.js?v=20261014-clock-course1','app.js?v=20261019-skak-clock-card1').replace('styles.css?v=20261014-clock-course1','styles.css?v=20261019-skak-clock-card1'); idx.write_text(h)
      - name: Verify patch
        run: |
          grep -q 'const canPlaySkak = () => gameModuleEnabled(state.user)' app.js
          grep -q 'clock-card-art' app.js
      - name: Commit published module
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html
          git commit -m 'Publish skak for all users and add clock card art'
          git push origin HEAD:main
# trigger 2