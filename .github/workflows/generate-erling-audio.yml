name: Generate Erling audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-erling-audio.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts certifi

      - name: Generate missing Erling recordings
        run: python scripts/generate_erling_audio.py

      - name: Add new Erling clips to main page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          marker = '  const ERLING_AUDIO_CLIPS = ['
          start = text.index(marker)
          end = text.index('  ];', start)
          block = text[start:end]
          clips = [
              'assets/figurer/audio/erling-det-er-dumt-at-oeve-sig.mp3',
              'assets/figurer/audio/erling-jo-mindre-du-ved.mp3',
              'assets/figurer/audio/erling-jeg-hader-dem-der-kan.mp3',
              'assets/figurer/audio/erling-hold-op-med-at-oeve-dig.mp3',
              'assets/figurer/audio/erling-giv-nu-bare-op.mp3',
              'assets/figurer/audio/erling-kom-og-vaer-sur.mp3',
          ]
          for clip in clips:
              if clip not in block:
                  block += f'    "{clip}",\n'
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Commit generated audio and wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js assets/figurer/audio/erling-*.mp3
          if git diff --cached --quiet; then
            echo 'No Erling changes.'
          else
            git commit -m 'Wire new recorded Erling voice lines'
            git push origin HEAD:main
          fi
