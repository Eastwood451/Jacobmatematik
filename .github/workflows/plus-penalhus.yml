name: Plus-penalhus cartoon
on:
  push:
    branches: [main, 'fix/plus-penalhus-*']
    paths: ['index.html', 'plus-penalhus.*', 'assets/figurer/plus-penalhus/**', 'assets/letters/audio/**', 'scripts/generate_letter_audio.py', 'scripts/generate_plus_penalhus_audio.py', 'scripts/test-learning-audio.py', 'scripts/test-plus-penalhus.cjs', '.github/workflows/plus-penalhus.yml']
  pull_request:
    paths: ['plus-penalhus.*', 'assets/figurer/plus-penalhus/**', 'assets/letters/audio/**', 'scripts/generate_letter_audio.py', 'scripts/generate_plus_penalhus_audio.py', 'scripts/test-learning-audio.py', 'scripts/test-plus-penalhus.cjs', '.github/workflows/plus-penalhus.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check plus-penalhus.js
          node --check scripts/test-plus-penalhus.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            npx playwright install ffmpeg
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check shipped Danish voice clips
        run: |
          pip install edge-tts==7.2.8 imageio-ffmpeg==0.6.0
          python scripts/test-learning-audio.py
      - name: Check actual Danish pronunciation
        run: |
          pip install faster-whisper==1.2.1 imageio-ffmpeg==0.6.0
          python scripts/check_plus_penalhus_pronunciation.py
      - name: Exercise with fake users
        if: always()
        run: node scripts/test-plus-penalhus.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plus-penalhus-review
          path: |
            test-results/plus-penalhus/
            assets/figurer/plus-penalhus/audio-v2/
          retention-days: 7


