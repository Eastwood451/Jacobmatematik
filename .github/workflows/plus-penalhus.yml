name: Plus-penalhus cartoon
on:
  push:
    branches: [main, 'fix/plus-penalhus-*']
    paths: ['index.html', 'app.js', 'module-loader.js', 'plus-penalhus.*', 'assets/figurer/plus-penalhus/**', 'assets/letters/audio/**', 'scripts/test-plus-penalhus.cjs', 'scripts/test-learning-audio*', 'scripts/generate_plus_penalhus_audio.py', 'scripts/generate_letter_audio.py', '.github/workflows/plus-penalhus.yml']
  pull_request:
    paths: ['index.html', 'app.js', 'module-loader.js', 'plus-penalhus.*', 'assets/figurer/plus-penalhus/**', 'assets/letters/audio/**', 'scripts/test-plus-penalhus.cjs', 'scripts/test-learning-audio*', 'scripts/generate_plus_penalhus_audio.py', 'scripts/generate_letter_audio.py', '.github/workflows/plus-penalhus.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check plus-penalhus.js
          node --check scripts/test-plus-penalhus.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check Danish narration text and shipped clips
        run: |
          pip install edge-tts==7.2.8 imageio-ffmpeg==0.6.0
          python scripts/test-learning-audio.py
      - name: Exercise with fake users
        if: always()
        run: |
          node scripts/test-plus-penalhus.cjs
          node scripts/test-learning-audio-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plus-penalhus-review
          path: |
            test-results/plus-penalhus/
            assets/figurer/plus-penalhus/audio/
          retention-days: 7

