name: Luigi ten friends pilot
on:
  push:
    branches: [main, 'feature/luigi-ten-friends-20261005']
    paths: ['app.js', 'index.html', 'pizza-friends.*', 'assets/pizza-friends/**', 'scripts/test-pizza-friends.cjs', '.github/workflows/pizza-friends.yml']
  pull_request:
    paths: ['app.js', 'index.html', 'pizza-friends.*', 'assets/pizza-friends/**', 'scripts/test-pizza-friends.cjs', '.github/workflows/pizza-friends.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check pizza-friends.js
          node --check scripts/test-pizza-friends.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check pilot with fake users
        run: node scripts/test-pizza-friends.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pizza-friends-review
          path: test-results/pizza-friends/
          retention-days: 7
