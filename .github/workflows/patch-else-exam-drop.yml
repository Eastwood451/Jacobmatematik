name: Patch Else exam paper attack
on:
  push:
    paths:
      - '.github/workflows/patch-else-exam-drop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add exam paper area attack integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('fps.js')
          s=p.read_text()
          replacements=[
            ("import { createElseAttacks, ELSE_THROW_INTERVAL } from './fps-else-attacks.js?v=20260907-ducts1';",
             "import { createElseAttacks, ELSE_THROW_INTERVAL, ELSE_EXAM_INTERVAL } from './fps-else-attacks.js?v=20260909-examdrop1';"),
            ("""const elseAttacks = createElseAttacks({ scene, colliders, onPlayerHit: () => {
  hurt(null, true);
  return gameActive;
} });""",
             """const elseAttacks = createElseAttacks({
  scene,
  colliders,
  onPlayerHit: () => {
    hurt(null, true);
    return gameActive;
  },
  onDumped: () => {
    speakLine('DUMPET!', { volume:1 });
    feedbackEl.textContent = 'DUMPET! Flyt dig ud af den røde markering!';
    feedbackEl.className = 'feedback bad';
  },
});"""),
            ("""function createElse() {
  const enemy = createElseRig(elseTexture);
  enemy.throwCooldown = 2;
  enemy.group.position.set(0, 0, 60);""",
             """function createElse() {
  const enemy = createElseRig(elseTexture);
  enemy.throwCooldown = 2;
  enemy.examDropCooldown = 3.4;
  enemy.group.position.set(0, 0, 60);"""),
            ("""      if (enemy.type === 'else' && schoolyardEntered && gameActive) {
        enemy.throwCooldown -= dt;
        if (enemy.throwCooldown <= 0) {
          elseAttacks.throwAt(enemy, camera.position);
          enemy.throwCooldown = ELSE_THROW_INTERVAL;
        }
      }""",
             """      if (enemy.type === 'else' && schoolyardEntered && gameActive) {
        enemy.throwCooldown -= dt;
        enemy.examDropCooldown -= dt;
        if (enemy.throwCooldown <= 0) {
          elseAttacks.throwAt(enemy, camera.position);
          enemy.throwCooldown = ELSE_THROW_INTERVAL;
        }
        if (enemy.examDropCooldown <= 0) {
          elseAttacks.dropExamAt(enemy, camera.position);
          enemy.examDropCooldown = ELSE_EXAM_INTERVAL;
        }
      }"""),
            ("feedbackEl.textContent = 'Løs divisioner. Undvig Elses linealer og røde tuscher!';",
             "feedbackEl.textContent = 'Løs divisioner. Undvig linealer, tuscher, chokbølger og røde nedslagsfelter!';"),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Missing expected fps.js block: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          h=Path('fps.html')
          hs=h.read_text().replace('fps.js?v=20260909-shockwave1','fps.js?v=20260909-examdrop1')
          h.write_text(hs)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-else-exam-drop.yml
          git config user.name "Eastwood451"
          git config user.email "107360579+Eastwood451@users.noreply.github.com"
          git add fps.js fps.html fps-else-attacks.js .github/workflows/patch-else-exam-drop.yml
          git commit -m "Add Else exam paper area attack"
          git push
