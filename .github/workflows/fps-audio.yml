name: Build FPS Danish voice clips

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fps-voice-lines.json'
      - 'scripts/generate_fps_audio.py'
      - '.github/workflows/fps-audio.yml'

permissions:
  contents: write

jobs:
  build-voice-clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio build dependencies
        run: python -m pip install --disable-pip-version-check edge-tts imageio-ffmpeg
      - name: Generate missing Danish clips
        run: python scripts/generate_fps_audio.py
      - name: Commit generated clips
        run: |
          if [ -z "$(git status --porcelain -- assets/figurer/audio)" ]; then
            echo "No new clips."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figurer/audio
          git commit -m "Generate Danish FPS voice clips"
          git push origin HEAD:main
