name: Fix Else exam cache
on:
  push:
    paths:
      - '.github/workflows/fix-else-exam-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump Else exam attack cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fps.js')
          s=p.read_text()
          old="./fps-else-attacks.js?v=20260907-ducts1"
          new="./fps-else-attacks.js?v=20260909-examdrop2"
          if old not in s:
              raise SystemExit('old Else attack import not found')
          p.write_text(s.replace(old,new,1))
          h=Path('fps.html')
          hs=h.read_text()
          hs=hs.replace('fps.js?v=20260909-shockwave1','fps.js?v=20260909-examdrop2')
          h.write_text(hs)
          PY
      - name: Commit
        run: |
          rm .github/workflows/fix-else-exam-cache.yml
          git config user.name "Eastwood451"
          git config user.email "107360579+Eastwood451@users.noreply.github.com"
          git add fps.js fps.html .github/workflows/fix-else-exam-cache.yml
          git commit -m "Bump Else exam attack cache"
          git push
