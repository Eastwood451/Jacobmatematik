name: Generate Luigi audio once

on:
  push:
    paths:
      - ".github/workflows/generate-luigi-audio-once.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tools
        run: |
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate Luigi line
        run: |
          python - <<'PY'
          import asyncio
          import subprocess
          from pathlib import Path
          import edge_tts

          output = Path("assets/figurer/audio")
          output.mkdir(parents=True, exist_ok=True)
          raw = output / ".luigi-nummer-treogtres-raw.mp3"
          final = output / "luigi-nummer-treogtres.mp3"

          async def main():
              await edge_tts.Communicate(
                  "Jeg bager nummer treogtres med ni pepperoni og syv champignon.",
                  "it-IT-DiegoNeural",
                  rate="-4%",
                  pitch="+3Hz",
                  volume="+5%",
              ).save(str(raw))

          asyncio.run(main())
          subprocess.run([
              "ffmpeg", "-y", "-loglevel", "error", "-i", str(raw),
              "-af",
              "highpass=f=80,lowpass=f=7000,"
              "equalizer=f=300:t=q:w=1:g=2,"
              "equalizer=f=2600:t=q:w=1.2:g=1.5,"
              "acompressor=threshold=-18dB:ratio=2.5:attack=5:release=90,"
              "loudnorm=I=-16:TP=-1.5:LRA=7,"
              "alimiter=limit=0.92",
              "-codec:a", "libmp3lame", "-b:a", "96k", str(final),
          ], check=True)
          raw.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: luigi-nummer-treogtres
          path: assets/figurer/audio/luigi-nummer-treogtres.mp3
          if-no-files-found: error
