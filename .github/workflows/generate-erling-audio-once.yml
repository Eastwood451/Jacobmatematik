name: Generate Erling audio once

on:
  push:
    paths:
      - ".github/workflows/generate-erling-audio-once.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tools
        run: |
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate Erling line
        run: |
          python - <<'PY'
          import asyncio
          import subprocess
          from pathlib import Path
          import edge_tts

          output = Path("assets/figurer/audio")
          output.mkdir(parents=True, exist_ok=True)
          raw = output / ".erling-jeg-kan-godt-jeg-gider-bare-ikke-raw.mp3"
          final = output / "erling-jeg-kan-godt-jeg-gider-bare-ikke.mp3"

          async def main():
              await edge_tts.Communicate(
                  "Jeg kan godt. Jeg gider bare ikke.",
                  "da-DK-JeppeNeural",
                  rate="-11%",
                  pitch="-15Hz",
                  volume="+8%",
              ).save(str(raw))

          asyncio.run(main())
          subprocess.run([
              "ffmpeg", "-y", "-loglevel", "error", "-i", str(raw),
              "-af",
              "highpass=f=70,lowpass=f=5600,"
              "equalizer=f=180:t=q:w=1:g=3,"
              "equalizer=f=2300:t=q:w=1.3:g=2.5,"
              "acrusher=bits=13:mix=0.055,"
              "acompressor=threshold=-18dB:ratio=3:attack=5:release=90,"
              "loudnorm=I=-16:TP=-1.5:LRA=7,"
              "alimiter=limit=0.92",
              "-codec:a", "libmp3lame", "-b:a", "96k", str(final),
          ], check=True)
          raw.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: erling-jeg-kan-godt-jeg-gider-bare-ikke
          path: assets/figurer/audio/erling-jeg-kan-godt-jeg-gider-bare-ikke.mp3
          if-no-files-found: error
